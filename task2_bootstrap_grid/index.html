<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2 - Bootstrap Grid</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container py-5">
        <h1 class="page-title text-center mb-4">Bootstrap Grid</h1>
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="info-box h-100">
                    <h2>Column 1</h2>
                    <p>On mobile this box takes the full row.</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="info-box h-100">
                    <h2>Column 2</h2>
                    <p>On tablet two boxes can stay in one row.</p>
                </div>
            </div>
            <div class="col-12 col-md-6 col-lg-4">
                <div class="info-box h-100">
                    <h2>Column 3</h2>
                    <p>On desktop all three boxes stay side by side.</p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
